name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Summarize tests and lint
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              print("TEST_RESULT", root.attrib)
              for failure in root.iter("failure"):
                  print(failure.text)
          for path in glob.glob("app/build/reports/lint-results-debug.xml"):
              root = ET.parse(path).getroot()
              for issue in root.findall("issue"):
                  if issue.attrib.get("id") not in ("GradleDependency", "NewerVersionAvailable"):
                      print("LINT", issue.attrib.get("severity"), issue.attrib.get("id"), issue.attrib.get("message"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TerraParcel-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/schemas/
          retention-days: 14
