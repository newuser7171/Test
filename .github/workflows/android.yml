name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, unit tests and lint
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Summarize tests and lint
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"):
              root = ET.parse(path).getroot()
              print("TEST_RESULT", root.attrib)
              for failure in root.iter("failure"):
                  print(failure.text)
          for path in glob.glob("app/build/reports/lint-results-debug.xml"):
              root = ET.parse(path).getroot()
              for issue in root.findall("issue"):
                  if issue.attrib.get("id") not in ("GradleDependency", "NewerVersionAvailable"):
                      print("LINT", issue.attrib.get("severity"), issue.attrib.get("id"), issue.attrib.get("message"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TerraParcel-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            app/schemas/
          retention-days: 14

  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/al.terraparcel/files/verification app/build/verification
      - name: Device test details
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob("app/build/outputs/androidTest-results/connected/**/*.xml",recursive=True):
              root=ET.parse(path).getroot()
              print(root.attrib)
              for failure in root.iter("failure"): print(failure.text)
          PYREPORT
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startup-device-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/verification/
